<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#10151c; --panel:#18202a; --line:#2a3644; --txt:#d6dde6; --mut:#7d8a99; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--txt); font:14px system-ui,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar button, #bar select, #bar input { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  #bar button { cursor:pointer; }
  #bar button.on { border-color:var(--acc); color:var(--acc); }
  #bar input { width:110px; }
  #bar .sp { flex:1; }
  #status { color:var(--mut); }
  #wrap { position:relative; flex:1; min-height:0; }
  #chart, #ov { position:absolute; inset:0; }
  #ov { pointer-events:none; }
  #ov.active { pointer-events:auto; cursor:crosshair; }
  body.viewer #tools { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="tools">
      <button data-t="trend">Trend line</button>
      <button data-t="hline">Horizontal</button>
      <button data-t="rect">Zone</button>
      <button data-t="long">Buy</button>
      <button data-t="short">Sell</button>
      <button id="undo">Undo</button>
      <button id="clear">Clear all</button>
      <input id="sym" value="BTCUSDT" aria-label="Symbol">
      <select id="tf" aria-label="Timeframe">
        <option>1m</option><option selected>5m</option><option>15m</option><option>1h</option><option>4h</option><option>1d</option>
      </select>
    </span>
    <span class="sp"></span>
    <span id="status">connecting…</span>
  </div>
  <div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const KEY = q.get('key');
const TRADER = !!KEY;
if (!TRADER) document.body.classList.add('viewer');

const IV = { '1m':60, '5m':300, '15m':900, '1h':3600, '4h':14400, '1d':86400 };
const NEED = { hline:1, trend:2, rect:2, long:3, short:3 };
let S = { symbol:'BTCUSDT', interval:'5m', drawings:[] };
let data = [], tool = null, draft = [], cursor = null, mkt = null;

/* ---------- chart ---------- */
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{ background:{ color:'#10151c' }, textColor:'#9aa7b6' },
  grid:{ vertLines:{ color:'#1a232d' }, horzLines:{ color:'#1a232d' } },
  timeScale:{ timeVisible:true, rightOffset:25, borderColor:'#2a3644' },
  rightPriceScale:{ borderColor:'#2a3644' },
  crosshair:{ mode:0 }
});
const series = chart.addCandlestickSeries({
  upColor:'#2ebd85', downColor:'#e5484d', wickUpColor:'#2ebd85', wickDownColor:'#e5484d', borderVisible:false
});
const ts = chart.timeScale();

/* ---------- time <-> logical (future area sathi pan chalto) ---------- */
const iv = () => IV[S.interval];
function toL(t) {
  if (!data.length) return 0;
  let lo = 0, hi = data.length - 1;
  if (t <= data[0].time) return (t - data[0].time) / iv();
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (data[m].time <= t) lo = m; else hi = m - 1; }
  return lo + (t - data[lo].time) / iv();
}
function fromL(l) {
  const b = Math.min(Math.max(Math.floor(l), 0), data.length - 1);
  return data[b].time + (l - b) * iv();
}
const X = t => ts.logicalToCoordinate(toL(t));
const Y = p => series.priceToCoordinate(p);

/* ---------- market data (Binance public) ---------- */
async function load() {
  if (mkt) { mkt.onclose = null; mkt.close(); }
  setStatus('loading ' + S.symbol);
  try {
    const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${S.symbol}&interval=${S.interval}&limit=1000`);
    const j = await r.json();
    data = j.map(k => ({ time:k[0]/1000, open:+k[1], high:+k[2], low:+k[3], close:+k[4] }));
    series.setData(data);
    mkt = new WebSocket(`wss://stream.binance.com:9443/ws/${S.symbol.toLowerCase()}@kline_${S.interval}`);
    mkt.onmessage = e => {
      const k = JSON.parse(e.data).k;
      const c = { time:k.t/1000, open:+k.o, high:+k.h, low:+k.l, close:+k.c };
      if (c.time === data[data.length-1].time) data[data.length-1] = c; else data.push(c);
      series.update(c);
    };
    mkt.onclose = () => setTimeout(load, 3000);
    setStatus(S.symbol + ' ' + S.interval);
  } catch (e) { setStatus('data error: symbol check kara'); }
}
const setStatus = s => document.getElementById('status').textContent = s;

/* ---------- sync ---------- */
const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/?key=' + (KEY || ''));
ws.onmessage = e => {
  const n = JSON.parse(e.data);
  const changed = n.symbol !== S.symbol || n.interval !== S.interval || !data.length;
  S = n;
  document.getElementById('sym').value = S.symbol;
  document.getElementById('tf').value = S.interval;
  if (changed) load();
};
const push = () => { if (TRADER && ws.readyState === 1) ws.send(JSON.stringify(S)); };

/* ---------- drawing render ---------- */
const cv = document.getElementById('ov'), g = cv.getContext('2d');
function resize() {
  const w = cv.parentElement, d = devicePixelRatio || 1;
  cv.width = w.clientWidth * d; cv.height = w.clientHeight * d;
  g.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe(cv.parentElement);

function label(txt, x, y, col) {
  g.font = '12px system-ui'; const w = g.measureText(txt).width + 10;
  g.fillStyle = col; g.fillRect(x, y - 9, w, 18);
  g.fillStyle = '#fff'; g.fillText(txt, x + 5, y + 4);
}

function drawOne(d, sel) {
  const P = d.pts, W = cv.clientWidth;
  const x0 = X(P[0].t), y0 = Y(P[0].p);
  if (x0 == null || y0 == null) return;
  g.lineWidth = 2;
  if (d.type === 'hline') {
    g.strokeStyle = '#f0b429'; g.beginPath(); g.moveTo(0, y0); g.lineTo(W, y0); g.stroke();
    label(P[0].p.toFixed(2), W - 80, y0, '#b8860b');
    return;
  }
  if (P.length < 2) return;
  const x1 = X(P[1].t), y1 = Y(P[1].p);
  if (x1 == null || y1 == null) return;
  if (d.type === 'trend') {
    g.strokeStyle = '#4da3ff'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  } else if (d.type === 'rect') {
    g.fillStyle = 'rgba(77,163,255,.18)'; g.strokeStyle = '#4da3ff';
    g.fillRect(x0, y0, x1 - x0, y1 - y0); g.strokeRect(x0, y0, x1 - x0, y1 - y0);
  } else {
    const entry = P[0].p, tgt = P[1].p;
    const stop = P[2] ? P[2].p : entry - (tgt - entry);
    const ys = Y(stop); if (ys == null) return;
    g.fillStyle = 'rgba(46,189,133,.25)'; g.fillRect(x0, Math.min(y0, y1), x1 - x0, Math.abs(y1 - y0));
    g.fillStyle = 'rgba(229,72,77,.25)';  g.fillRect(x0, Math.min(y0, ys), x1 - x0, Math.abs(ys - y0));
    g.strokeStyle = '#d6dde6'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.stroke();
    const rr = Math.abs(tgt - entry) / (Math.abs(stop - entry) || 1);
    label((d.type === 'long' ? 'BUY ' : 'SELL ') + entry.toFixed(2) + '   RR ' + rr.toFixed(2), x0 + 4, y0, d.type === 'long' ? '#1f8a62' : '#b3363b');
    label('TP ' + tgt.toFixed(2), x1 - 80, y1, '#1f8a62');
    label('SL ' + stop.toFixed(2), x1 - 80, ys, '#b3363b');
  }
}

function frame() {
  g.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  if (data.length) {
    S.drawings.forEach(d => drawOne(d));
    if (tool && draft.length) {
      const pts = cursor ? draft.concat([cursor]) : draft;
      drawOne({ type:tool, pts:pts.slice(0, NEED[tool]) });
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- trader interactions ---------- */
function pt(e) {
  const r = cv.getBoundingClientRect();
  const l = ts.coordinateToLogical(e.clientX - r.left);
  const p = series.coordinateToPrice(e.clientY - r.top);
  return (l == null || p == null) ? null : { t:fromL(l), p };
}
function setTool(t) {
  tool = (tool === t) ? null : t; draft = []; cursor = null;
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tool));
  cv.classList.toggle('active', !!tool);
}
if (TRADER) {
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setTool(b.dataset.t));
  cv.addEventListener('pointermove', e => { cursor = pt(e); });
  cv.addEventListener('pointerdown', e => {
    const p = pt(e); if (!p || !tool) return;
    draft.push(p);
    if (draft.length === NEED[tool]) {
      S.drawings.push({ id:Date.now(), type:tool, pts:draft });
      draft = []; push(); setTool(tool); // tool band hoto, parat nivdava lagto
    }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') { draft = []; if (tool) setTool(tool); } });
  document.getElementById('undo').onclick = () => { S.drawings.pop(); push(); };
  document.getElementById('clear').onclick = () => { if (confirm('Sagle drawings delete karaychet?')) { S.drawings = []; push(); } };
  const symEl = document.getElementById('sym'), tfEl = document.getElementById('tf');
  const change = () => { S.symbol = symEl.value.trim().toUpperCase(); S.interval = tfEl.value; S.drawings = []; load(); push(); };
  symEl.onchange = change; tfEl.onchange = change;
}
</script>
</body>
</html>
